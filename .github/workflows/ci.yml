name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ticket-router:ci
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --progress=plain -t "$IMAGE" .

      - name: Image size and installed packages
        run: |
          docker image ls "$IMAGE"
          echo "size_bytes=$(docker image inspect "$IMAGE" --format '{{.Size}}')"
          docker run --rm "$IMAGE" pip freeze | tee pip-freeze.txt
          echo "packages=$(wc -l < pip-freeze.txt)"

      - name: Tests inside the image
        run: docker run --rm -e CI=true "$IMAGE" python -m pytest -q -rs -p no:cacheprovider

      - name: Start the container and check /health and /predict
        run: |
          set -eu
          docker run -d --name api -p 7860:7860 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -s -o /dev/null localhost:7860/health; then break; fi
            sleep 1
          done
          code=$(curl -s -o health.json -w '%{http_code}' localhost:7860/health)
          echo "GET /health -> HTTP $code: $(cat health.json)"
          test "$code" = 200
          cat > request.json <<'EOF'
          {"subject": "System Failure Caused by Overload", "body": "The investment optimization system encountered a crash, which may be due to data overload or a software bug. After rebooting and reviewing logs, the issue still persists. We need your assistance to resolve this problem."}
          EOF
          code=$(curl -s -o predict.json -w '%{http_code}' -X POST localhost:7860/predict \
            -H 'Content-Type: application/json' --data @request.json)
          echo "POST /predict -> HTTP $code: $(cat predict.json)"
          test "$code" = 200

      # Render free tier: 512 MB RAM, and Render sets PORT (10000 by default). Measurement only.
      - name: Memory under a 512 MB limit, served on PORT=10000
        run: |
          set -u
          docker run -d --name mem --memory=512m --memory-swap=512m -e PORT=10000 -p 10000:10000 "$IMAGE"
          up=no
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:10000/health)" = 200 ]; then up=yes; break; fi
            sleep 1
          done
          echo "PORT=10000 -> /health 200: $up"

          snap() {
            if [ "$(docker inspect -f '{{.State.Running}}' mem)" != true ]; then
              echo "| $1 | container not running | - | - |" >> mem.md; return
            fi
            stats=$(docker stats --no-stream --format '{{.MemUsage}}' mem)
            current=$(docker exec mem cat /sys/fs/cgroup/memory.current)
            peak=$(docker exec mem cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a)
            echo "| $1 | $stats | $current | $peak |" >> mem.md
          }

          {
            echo "## Container memory (--memory=512m, PORT=10000)"
            echo
            echo "cgroup memory.max: $(docker exec mem cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
            echo
            echo "| point | docker stats MEM USAGE / LIMIT | memory.current (bytes) | memory.peak (bytes) |"
            echo "| --- | --- | --- | --- |"
          } > mem.md
          snap "startup (/health 200)"
          sleep 30
          snap "idle 30 s later"

          docker run --rm -i --network host "$IMAGE" python - <<'EOF'
          import httpx
          import pandas as pd

          tickets = pd.read_parquet("data/processed/test.parquet").head(200)
          codes = {}
          with httpx.Client(base_url="http://localhost:10000", timeout=30) as client:
              for t in tickets.itertuples():
                  subject = t.subject if isinstance(t.subject, str) else None
                  code = client.post("/predict", json={"subject": subject, "body": t.body}).status_code
                  codes[code] = codes.get(code, 0) + 1
          print(f"200 sequential /predict requests -> status codes: {codes}")
          EOF
          snap "after 200 sequential /predict"

          state=$(docker inspect -f 'status={{.State.Status}} OOMKilled={{.State.OOMKilled}} exit={{.State.ExitCode}}' mem)
          events=$(docker exec mem cat /sys/fs/cgroup/memory.events 2>/dev/null | tr '\n' ' ' || echo n/a)
          {
            echo
            echo "Container state: $state"
            echo
            echo "memory.events: $events"
          } >> mem.md
          cat mem.md
          cat mem.md >> "$GITHUB_STEP_SUMMARY"
          case "$state" in *OOMKilled=true*) echo "OOM-killed under 512 MB"; exit 1;; esac
          test "$up" = yes

      - name: Container logs
        if: always()
        run: |
          docker logs api 2>&1 || true
          echo "--- mem container ---"
          docker logs mem 2>&1 || true

  # Measures how much a Linux refit of TF-IDF moves the metrics. It never touches results/,
  # results.json or the served artifact; the numbers go to the job summary and a job artifact.
  refit-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ticket-router:sensitivity
    steps:
      - uses: actions/checkout@v4

      - name: Record runner CPU
        run: |
          lscpu > lscpu.txt
          {
            echo "## Runner CPU"
            echo
            echo '```'
            grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):' lscpu.txt
            echo "SIMD flags: $(grep '^Flags:' lscpu.txt | grep -oE '\b(sse4_2|avx|avx2|fma|avx512[a-z0-9_]*|avx_vnni|amx[a-z0-9_]*)\b' | sort -u | tr '\n' ' ')"
            echo '```'
            echo
          } | tee cpu-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat cpu-summary.md

      - name: Build image
        run: docker build --progress=plain -t "$IMAGE" .

      - name: Refit TF-IDF on Linux and score it
        run: |
          docker run --name sens "$IMAGE" python src/ticket_router/refit_sensitivity.py --out-dir /tmp/sens
          docker cp sens:/tmp/sens ./sens
          cp lscpu.txt cpu-summary.md sens/
          cat sens/refit_sensitivity.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: refit-sensitivity
          path: sens/
