# ==============================================================================
# QLoRA fine-tuning config for ticket-router -- step-07
# Every hyperparameter used by notebooks/train_qlora.ipynb lives here.
# Nothing is hardcoded in the notebook itself: it reads this file and only
# this file for every setting below.
# ==============================================================================

# --- Base model ---------------------------------------------------------------
# The open-weights fine-tuning target set in step-06 (.env's FT_BASE_MODEL,
# defaulting to this same value in code) -- NOT a hosted API model. This is
# the whole point of steps 07-12: a model we can self-host, quantize, and
# serve ourselves. Confirmed publicly downloadable, not gated, before it was
# picked as the default (HF API: "gated": false, "private": false,
# license apache-2.0 -- see PROGRESS.md step-06).
base_model: Qwen/Qwen2.5-1.5B-Instruct

# --- Data -----------------------------------------------------------------------
# Written by src/ticket_router/make_sft_dataset.py (step-06). Paths are
# relative to the repo root. NOTE: data/processed/ is gitignored (see
# .gitignore) -- these files are NOT included in a plain `git clone`; they
# must be uploaded/synced separately when running on Colab (see the
# notebook's "Get the repo" cell).
train_file: data/processed/sft/train.jsonl
val_file: data/processed/sft/val.jsonl

# From step-06's correction: sized to the TRUE MAXIMUM train-example length
# (377 tokens, Qwen2.5-1.5B-Instruct's own tokenizer), rounded up to the
# nearest 32 -- deliberately NOT a percentile. The assistant's JSON label
# sits at the END of every sequence, so a percentile-based cap truncates the
# label on every example above that percentile, teaching the model to emit
# incomplete JSON -- that poisons the training set, not just loses rows from
# it. See PROGRESS.md's step-06 correction for the full reasoning and the
# verified zero-truncation counts on all three splits.
max_seq_len: 384

# --- Reproducibility -------------------------------------------------------------
seed: 42

# --- Quantization (QLoRA: 4-bit NF4) ----------------------------------------------
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  # bnb_4bit_compute_dtype is deliberately NOT set here -- it is decided AT RUNTIME by the
  # notebook's GPU-check cell (cell 1): bfloat16 on Ampere-or-newer (CUDA compute capability
  # major >= 8), float16 otherwise. The free Colab tier usually allocates a T4, which is
  # Turing (compute capability 7.5) and does NOT support bf16 -- hardcoding bfloat16 here would
  # be silently wrong on the exact GPU this notebook is most likely to run on. See the printed
  # "GPU detected / compute dtype chosen" line at the top of the notebook's output.
  bnb_4bit_use_double_quant: true

# --- LoRA --------------------------------------------------------------------------
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  # Attention projections AND MLP projections, per the instruction -- LoRA on
  # attention alone would leave the MLP blocks (most of a Qwen2 layer's
  # parameters) completely untouched by fine-tuning.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

gradient_checkpointing: true

# --- Training loop -----------------------------------------------------------------
num_train_epochs: 3
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4   # effective batch size = 4 * 4 = 16
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
optim: paged_adamw_8bit
max_grad_norm: 0.3

# --- Completion-only loss -----------------------------------------------------------
# The loss is computed ONLY on the assistant's response tokens; system and user tokens
# contribute nothing to the loss or its gradient. Without this, most of the model's
# fine-tuning capacity goes into learning to WRITE support tickets (reproducing the user
# turn) instead of learning to CLASSIFY them (producing the assistant turn) -- the actual
# task.
#
# MECHANISM CHANGED after the original step-07 write-up. That version used
# trl.DataCollatorForCompletionOnlyLM, keyed on a response_template string
# ("<|im_start|>assistant\n"). Confirmed against the real Colab environment (trl 1.13.0,
# transformers 5.17.0, peft 0.20.0 -- not assumed): that class no longer exists, and trl
# exports NO collator classes at all in this version. The obvious replacement,
# SFTConfig(assistant_only_loss=True) -- masks via the chat template's own
# {% generation %} markers, through apply_chat_template(return_assistant_tokens_mask=True)
# -- was tried and rejected: Qwen2.5's chat template has no {% generation %} markers, so
# the returned assistant_masks array comes back ALL ZEROS. It does not raise -- it would
# silently mask every token and train on nothing.
#
# Fixed by changing the DATASET FORMAT instead of hunting for another collator class:
# data/processed/sft/*.jsonl (src/ticket_router/make_sft_dataset.py) now stores each
# example as {"prompt": [system, user], "completion": [assistant]} -- TRL's conversational
# prompt-completion format -- instead of one flat "messages" list. With that split stored
# explicitly in the data, completion_only_loss=True below finds the loss boundary from
# tokenized length (prompt tokens, then completion tokens), not from matching a literal
# response_template string against the rendered sequence -- so there's nothing that needs
# to stay in sync with a chat template's exact token boundaries, and no dependency on the
# chat template supporting generation-role masking either. Verified by hand in the
# notebook's masking-verification cell (step 7): decodes the completion tokens and asserts
# they are EXACTLY the gold assistant JSON, not merely that "some tokens are unmasked" --
# a check that only confirms a field exists, which is exactly the class of check that let
# the original response_template mechanism's removal go unnoticed until it was probed
# directly against a real Colab session.
completion_only_loss: true

# --- Padding / collator ---------------------------------------------------------------
# Dynamic per-batch padding: each batch is padded to ITS OWN longest example,
# not to max_seq_len for every example. This was left open in step-06;
# confirmed by hand here (tokenizer.pad() behavior, no trl/torch needed for
# this specific check -- see PROGRESS.md step-07) and locked in via
# DataCollatorForCompletionOnlyLM's default padding=True behavior. Raising
# max_seq_len therefore costs ~nothing in compute -- it only changes the rare
# batch that contains one of the longer examples.
padding: dynamic_per_batch

# --- Evaluation & checkpointing ---------------------------------------------------------
# Step math: 13,070 train examples / effective batch size 16 (per_device 4 x grad_accum 4)
# = ~817 steps/epoch, ~2,450 steps over num_train_epochs=3. At eval_steps=50 that was 49 full
# evaluations over 1,635 validation examples during a single GPU session with a time limit --
# spending more GPU time measuring than learning. eval_steps/save_steps raised to 250 (~10
# evaluations over the full run) to fix that.
eval_strategy: steps
eval_steps: 250
save_strategy: steps
save_steps: 250
logging_steps: 10

# save_total_limit is deliberately null (unlimited -- Trainer keeps every checkpoint). With
# load_best_model_at_end=false (below), Trainer's own "protect the best checkpoint from
# rotation" logic is OFF -- a finite save_total_limit would silently delete older checkpoints
# as training progresses, on a plain FIFO/step-order basis, with NO awareness of which one is
# actually best. At ~2,450 full-run steps / save_steps=250, that's ~10 checkpoints; a limit of
# 3 (the old value) would keep only the LAST 3 -- and on 13,070 examples over 3 epochs,
# overfitting typically starts well before the end, so the true best checkpoint (by full-val
# eval_loss, picked in the notebook's step 14) could be deleted long before training
# finishes, silently, with no error. These are LoRA adapters (a few tens of MB each), not full
# model weights, so keeping all of them is cheap -- the notebook's smoke-test cell (step 11)
# measures one real checkpoint's on-disk size and projects the full-run total before the full
# run starts, specifically to catch it if that assumption turns out to be wrong on Colab's
# actual free disk.
save_total_limit: null

# Two DIFFERENT validation numbers are used in this run -- do not confuse one for the other:
#   1. MID-TRAINING (every eval_steps, logged to the loss curve): a fixed, seeded random
#      SUBSAMPLE of the validation set, size eval_subsample_size below. Fast, for monitoring
#      the trend only. THE LOSS CURVE PLOTTED DURING TRAINING IS THIS SUBSAMPLE METRIC, NOT A
#      FULL-VAL METRIC.
#   2. FINAL best-checkpoint selection (once, after the full run, over EVERY checkpoint saved
#      above -- save_total_limit is null, so none are deleted): the FULL validation set (all
#      1,635 examples), done manually in the notebook's "Select best checkpoint" cell -- see
#      there.
#      This is why load_best_model_at_end is false below: Trainer's own load_best_model_at_end
#      would select against whichever eval_dataset it's given, which during training is the
#      subsample -- picking the true best checkpoint needs the full set, so that selection is
#      done manually instead, after training finishes.
eval_subsample_size: 400
eval_subsample_seed: 42
load_best_model_at_end: false   # see note above -- final selection is manual, over the FULL val set
metric_for_best_model: eval_loss
greater_is_better: false   # lower eval_loss is better -- keep the BEST checkpoint, not the last

# --- Smoke test (short run before committing to the full run) -----------------------------
smoke_test:
  max_steps: 100
  eval_steps: 20
  logging_steps: 5
  n_generated_examples: 5

# --- Post-training eyeball preview (right after training, before full harness eval) ---------
post_train_preview:
  n_val_examples: 20

# --- Known limitation: no class weighting --------------------------------------------------
# No per-class loss weighting or minority-class oversampling is applied,
# despite real queue-class imbalance in training data (e.g. "General
# Inquiry"/"Human Resources" have far fewer rows than "Technical Support" --
# see data/README.md's label distribution). Reason: this is the FIRST
# fine-tuning run for this project, and the goal is an interpretable
# baseline result with the fewest moving parts -- adding class weighting now
# would make it unclear whether any change in results comes from
# fine-tuning itself or from the weighting scheme on top of it. Revisit if
# per-class evaluation (after this step) shows minority classes are being
# systematically ignored.
class_weighting: none

# --- Hugging Face Hub ------------------------------------------------------------------------
push_to_hub: true
hub_model_id: "Omar-Mohsen22/ticket-router-qwen2.5-1.5b-qlora"
hub_private: true

# --- Output paths (Colab-local; the adapter is pushed to the Hub, not committed here) ---------
output_dir: outputs/qlora-run
smoke_test_output_dir: outputs/qlora-smoke-test
adapter_output_dir: outputs/qlora-adapter
